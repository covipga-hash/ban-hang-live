<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="200" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFF5EB"/>
      <stop offset="100%" stop-color="#FFE2EC"/>
    </linearGradient>
    <linearGradient id="hair" x1="100" y1="22" x2="100" y2="195" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#27242C"/>
      <stop offset="100%" stop-color="#141318"/>
    </linearGradient>
    <linearGradient id="skin" x1="100" y1="54" x2="100" y2="148" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFECE2"/>
      <stop offset="100%" stop-color="#FBD6C4"/>
    </linearGradient>
  </defs>

  <circle cx="100" cy="100" r="100" fill="url(#bg)"/>

  <!-- Soft colorful fabric market bokeh hint in background -->
  <circle cx="34" cy="52" r="16" fill="#FDE68A" opacity="0.45"/>
  <circle cx="168" cy="60" r="18" fill="#BFDBFE" opacity="0.45"/>
  <circle cx="162" cy="138" r="14" fill="#FBCFE8" opacity="0.5"/>

  <!-- Back straight long black hair -->
  <path d="M44 96 C40 44, 68 24, 100 24 C132 24, 160 44, 156 96 L160 198 H40 Z" fill="url(#hair)"/>

  <!-- White short puff-sleeve top shoulders -->
  <ellipse cx="44" cy="176" rx="28" ry="26" fill="#FFFFFF" stroke="#E5D5CE" stroke-width="3"/>
  <ellipse cx="156" cy="176" rx="28" ry="26" fill="#FFFFFF" stroke="#E5D5CE" stroke-width="3"/>
  <path d="M54 156 C72 178, 128 178, 146 156 L156 200 H44 Z" fill="#FFFFFF" stroke="#E5D5CE" stroke-width="3"/>

  <!-- Woven crossbody bag strap (diagonal like reference photo) -->
  <path d="M132 154 L94 200" stroke="#C5985B" stroke-width="8" stroke-linecap="round"/>
  <path d="M132 154 L94 200" stroke="#E8C996" stroke-width="3" stroke-dasharray="6 5" stroke-linecap="round"/>

  <!-- Neck -->
  <rect x="86" y="132" width="28" height="32" rx="12" fill="#F5CBB7"/>

  <!-- Ears -->
  <ellipse cx="52" cy="104" rx="8" ry="12" fill="#FBD6C4"/>
  <ellipse cx="148" cy="104" rx="8" ry="12" fill="#FBD6C4"/>

  <!-- Cute round face -->
  <ellipse cx="100" cy="96" rx="48" ry="49" fill="url(#skin)"/>

  <!-- Soft rosy cheeks -->
  <ellipse cx="72" cy="110" rx="13" ry="7.5" fill="#FB7185" opacity="0.34"/>
  <ellipse cx="128" cy="110" rx="13" ry="7.5" fill="#FB7185" opacity="0.34"/>

  <!-- Eyebrows -->
  <path d="M68 80 Q79 75 89 79" stroke="#2B262B" stroke-width="2.8" stroke-linecap="round"/>
  <path d="M111 79 Q121 75 132 80" stroke="#2B262B" stroke-width="2.8" stroke-linecap="round"/>

  <!-- Expressive Asian dark eyes + lashes + catchlights -->
  <path d="M68 95 Q79 87 90 95" stroke="#1E1B22" stroke-width="3.2" stroke-linecap="round"/>
  <ellipse cx="79" cy="97" rx="7.5" ry="7.8" fill="#1F1B24"/>
  <circle cx="76.5" cy="94" r="2.6" fill="#FFFFFF"/>
  <circle cx="82" cy="99.5" r="1.2" fill="#FFFFFF"/>

  <path d="M110 95 Q121 87 132 95" stroke="#1E1B22" stroke-width="3.2" stroke-linecap="round"/>
  <ellipse cx="121" cy="97" rx="7.5" ry="7.8" fill="#1F1B24"/>
  <circle cx="118.5" cy="94" r="2.6" fill="#FFFFFF"/>
  <circle cx="124" cy="99.5" r="1.2" fill="#FFFFFF"/>

  <!-- Delicate nose -->
  <path d="M99 104 Q101 108 98 110" stroke="#E5B29C" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Warm friendly smile -->
  <path d="M87 121 Q100 131 113 121" stroke="#D9536F" stroke-width="3.2" stroke-linecap="round"/>
  <path d="M92 124 Q100 129 108 124" stroke="#FDA4AF" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Front straight black hair crown + wispy side bangs (like reference photo) -->
  <path d="M46 92 C48 44, 72 28, 100 28 C128 28, 152 44, 154 92 C146 66, 132 52, 110 47 C96 58, 76 60, 56 84 Z" fill="url(#hair)"/>
  <!-- Wispy forehead strands -->
  <path d="M84 44 Q78 66 64 78" stroke="#18161D" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M100 42 Q98 62 90 72" stroke="#18161D" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M114 45 Q126 62 138 78" stroke="#18161D" stroke-width="4.5" stroke-linecap="round"/>

  <!-- Front long straight hair section swept forward over right shoulder (signature look in photo!) -->
  <path d="M144 92 C152 128, 146 164, 126 196 L104 196 C120 166, 130 132, 136 96 Z" fill="url(#hair)"/>
  <path d="M52 94 C48 128, 52 162, 62 192 L72 190 C63 160, 60 128, 60 98 Z" fill="url(#hair)"/>

  <!-- Hair shine -->
  <path d="M68 48 Q88 38 112 44" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" opacity="0.22"/>
</svg>
